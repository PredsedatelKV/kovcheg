services:
  kovcheg:
    build: .
    container_name: kovcheg-app
    restart: unless-stopped
    # The application is available only locally; Caddy handles public HTTPS.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # Persistent data (SQLite database and knowledge storage).
      - ./data:/app/data
      # Static assets may be edited without rebuilding the image.
      - ./static:/app/static
    networks:
      - kovcheg-net

  caddy:
    image: caddy:2.8-alpine
    container_name: kovcheg-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kovcheg
    networks:
      - kovcheg-net

networks:
  kovcheg-net:

volumes:
  caddy_data:
  caddy_config:
