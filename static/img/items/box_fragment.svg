<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bfFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#15151a"/>
    </linearGradient>
    <linearGradient id="bfLid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4a54"/>
      <stop offset="100%" stop-color="#242430"/>
    </linearGradient>
    <filter id="bfShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Осколок ковбокса: рваный край справа/снизу, чёрный корпус -->
  <g filter="url(#bfShadow)">
    <path d="M14 30 L40 16 L58 26 L46 33 L52 44 L40 40 L30 52 L26 40 L14 44 Z"
          fill="url(#bfLid)" stroke="#0c0c10" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14 44 L26 40 L30 52 L40 40 L36 60 L20 66 L14 60 Z"
          fill="url(#bfFace)" stroke="#0c0c10" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- Замочек-скоба -->
  <rect x="30" y="36" width="12" height="10" rx="2" fill="#101014" stroke="#3a3a42" stroke-width="1.5"/>
  <circle cx="36" cy="41" r="2.4" fill="#5a5a66"/>
  <!-- Блик, чтобы читался объём -->
  <path d="M18 30 L38 19" stroke="#6a6a76" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <!-- Скол по краю -->
  <path d="M52 44 L60 47 L54 52 L48 49 Z" fill="#1a1a20" stroke="#0c0c10" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
