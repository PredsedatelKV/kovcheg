<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ковчег</title>
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
  <link rel="stylesheet" href="/static/style.css?v=236" />
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar">
      <button class="tabbtn" data-tab="koverna" aria-label="Коверна">
        <span class="tab-icon" style="--mask-url:url(/static/img/tabs/koverna.svg?v=236)"></span>
        <span>Коверна</span>
      </button>
      <button class="tabbtn" data-tab="profile" aria-label="Профиль">
        <span class="tab-icon" style="--mask-url:url(/static/img/tabs/profile.svg?v=236)"></span>
        <span>Профиль</span>
      </button>
      <button class="tabbtn" data-tab="home" aria-label="Главная">
        <span class="tab-icon" style="--mask-url:url(/static/img/tabs/home.svg?v=236)"></span>
        <span>Главная</span>
      </button>
      <button class="tabbtn" data-tab="arcade" aria-label="Аркада">
        <span class="tab-icon" style="--mask-url:url(/static/img/tabs/gamepad.svg?v=236)"></span>
        <span>Аркада</span>
      </button>
      <button class="tabbtn" data-tab="battlepass" aria-label="Пропуск">
        <span class="tab-icon" style="--mask-url:url(/static/img/tabs/battlepass.svg?v=236)"></span>
        <span>Пропуск</span>
      </button>
      <button class="tabbtn admin-only" data-tab="admin" aria-label="Админ" hidden>
        <span class="tab-icon" style="--mask-url:url(/static/img/tabs/admin.svg?v=236)"></span>
        <span>Админ</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="runtime-diagnostics" role="alert" aria-live="polite" hidden
       style="position:fixed;left:12px;right:12px;top:12px;z-index:10000;color:#8b1d1d;padding:12px;background:#fee;border:1px solid #e9a3a3;border-radius:8px;"></div>
  <script>
    function showRuntimeError(label, detail) {
      var box = document.getElementById('runtime-diagnostics');
      if (!box) return;
      box.hidden = false;
      box.textContent = label + ': ' + String(detail || 'неизвестная ошибка');
    }
    window.onerror = function(msg, url, line, col, error) {
      showRuntimeError('Ошибка интерфейса', msg + (line ? ' · строка ' + line : ''));
    };
    window.addEventListener('unhandledrejection', function(e) {
      showRuntimeError('Ошибка запроса', e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>
  <script type="module" src="/static/app.js?v=236"></script>
</body>
</html>
