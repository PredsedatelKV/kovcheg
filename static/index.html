<!doctype html>
<html lang="ru" class="winter">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6FA">
  <title>Ковчег</title>
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
  <link rel="stylesheet" href="/static/style.css?v=288">
  <link rel="stylesheet" href="/static/releases/winter-2026-r3/winter.css">
  <link rel="stylesheet" href="/static/releases/winter-2026-r3/pig-overhang-v3.css">
</head>
<body>
  <div id="app">
    <div id="winter-flakes" aria-hidden="true"></div>
    <header class="station-header" id="station-header" hidden>
      <div class="station-header-inner">
        <button type="button" class="station-tool" data-shell="chat" aria-label="Чат" data-icon="chat"></button>
        <div class="station-currencies">
          <button type="button" class="station-balance" data-shell="profile" aria-label="Ковбаксы" data-balance><span data-icon="coin"></span><strong>—</strong></button>
          <button type="button" class="station-balance" data-shell="profile" aria-label="Снежинки" data-snowflakes><span data-icon="snowflake"></span><strong>—</strong></button>
        </div>
        <button type="button" class="station-tool" data-shell="menu" aria-label="Меню" data-icon="menu"></button>
      </div>
    </header>
    <main id="view" class="view" aria-label="Ковчег"><div class="entry-loading" role="status"><span class="entry-loader"></span>Загружаем Ковчег</div></main>
    <nav id="tabbar" class="tabbar" aria-label="Основная навигация" hidden>
      <div class="station-nav">
        <button type="button" class="tabbtn" data-tab="koverna"><span data-icon="koverna"></span><span>Коверна</span></button>
        <button type="button" class="tabbtn" data-tab="profile"><span data-icon="profile"></span><span>Профиль</span></button>
        <button type="button" class="tabbtn" data-tab="home"><span data-icon="home"></span><span>Главная</span></button>
        <button type="button" class="tabbtn" data-tab="arcade"><span data-icon="arcade"></span><span>Аркада</span></button>
        <button type="button" class="tabbtn" data-tab="battlepass"><span data-icon="battlepass"></span><span>Пропуск</span></button>
      </div>
    </nav>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="/static/releases/winter-2026-r3/app.js"></script>
</body>
</html>
