  <style id="kov-entry-fallback">
    #entry-screen { position: fixed; inset: 0; display: grid; place-items: center; z-index: 500; background: #0d1733; }
    #entry-screen .entry-cube { display: block; width: 24px; height: 24px; border: 2px solid #aac8f3; border-radius: 5px; transform: rotate(45deg); }
    #entry-screen button { color: #0d1733; background: #b6d8ff; border: 0; border-radius: 10px; padding: 12px 18px; }
    #app[inert], #modal-root:empty { visibility: hidden; }

  <script>
    window.kovAssetCacheReady = (async () => {
      if (!navigator.serviceWorker || !window.caches) return false;
      const workers = navigator.serviceWorker;
      const url = new URL("/asset-worker.js?release=winter-2026-r45", location.href);
      const ready = () => workers.controller?.scriptURL === url.href;
      if (ready()) return true;
      return new Promise(resolve => {
        const done = (result) => {
          clearTimeout(timer);
          workers.removeEventListener("controllerchange", check);
          resolve(result);
        };
        const check = () => { if (ready()) done(true); };
        const timer = setTimeout(() => done(false), workers.controller ? 4000 : 1900);
        workers.addEventListener("controllerchange", check);
        workers.register(url.href, { scope: "/", updateViaCache: "none" }).then(check, () => done(false));
        check();
      });
    })().catch(() => false);

    window.kovStylesReady = window.kovAssetCacheReady.then(() => {
      const styles = document.getElementById("kov-release-styles").content;
      const app = document.createElement("link");
      app.rel = "modulepreload";
      app.href = "/static/releases/winter-2026-r45/app.js";
      document.head.appendChild(app);
      return Promise.all([...styles.querySelectorAll("link")].map(link => new Promise(resolve => {
        link.onload = link.onerror = resolve;
        document.head.appendChild(link);
      })));
    });
  </script>

    try {
      await window.kovStylesReady;
      await import("/static/releases/winter-2026-r45/app.js");

    } catch (error) {
      const retry = document.createElement("button");
      retry.textContent = "Повторить вход";
      retry.onclick = () => location.reload();
